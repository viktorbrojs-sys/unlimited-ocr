name: Syntax check

on:
  push:
  pull_request:

jobs:
  py-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile-check app.py
        run: python -m py_compile app.py
      - name: Shell syntax check
        run: |
          bash -n start.sh
          sh -n install.sh
